function setMode(m){mode=m;document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
if(m==="top"){cam.pit=1.5;cam.dist=330;cam.goal.set(0,0,0)}if(m==="free"){cam.pit=.62;cam.dist=170;cam.goal.set(0,0,0)}
if(m==="follow"){if(!sel&&robots.size)select([...robots.keys()][0]);cam.dist=16;cam.pit=.42}}
function select(id){sel=id;card()}
function card(){const d=cit.get(sel),c=$("#card");if(!d){c.style.display="none";return}c.style.display="block";const n=d.needs||{};
c.innerHTML=`<b>${esc(d.name)}</b> ${esc(d.role)}, ${t("bal")}: ${Math.round(d.balance)}<br>${t("hun")}<div class="bar"><i style="width:${+n.hunger||0}%"></i></div>${t("soc")}<div class="bar"><i style="width:${+n.social||0}%"></i></div>`}
const api=async p=>{const r=await fetch(SB+p,{headers:{apikey:KEY}});if(!r.ok)throw new Error(r.status);return r.json()};
async function load(){try{const[c,ev,ct]=await Promise.all([api("/citizens?alive=eq.true&order=id"),api("/events?order=id.desc&limit=40"),api("/control?select=tick,world_day,paused")]);
c.forEach(d=>{cit.set(d.id,d);const p=pos(d.x,d.y);let r=robots.get(d.id);if(!r){const g=robot(d);g.position.copy(p);S.add(g);r={g,to:p.clone()};robots.set(d.id,r)}r.to.copy(p)});
events=ev;ctl=ct[0]||{};err=false}catch(e){err=true}render()}
const txt=e=>L==="en"?((e.payload&&e.payload.en)||e.explain):e.explain;
function render(){document.querySelectorAll("[data-m]").forEach(b=>b.textContent=t(b.dataset.m));$("#tm").textContent=t("tm")+": "+t(tmode);$("#lg").textContent=L==="uk"?"EN":"UA";$("#wx").textContent=t("wx")+": "+t(wmode);$("#ht").textContent=t("feed");$("#hn").textContent=events.length;
$("#stat").textContent=err?t("err"):ctl.tick==null?t("load"):`${t("day")} ${ctl.world_day}, ${t("tick")} ${ctl.tick}, ${cit.size} ${t("cit")}`;
$("#list").innerHTML=events.map(e=>{const n=cit.get(e.citizen_id),d=new Date(e.ts),r=L==="en"?(RE[e.reason]||e.reason):e.reason;
return `<div class="ev" data-id="${+e.citizen_id}"><b>${esc(n?n.name:"?")}</b> ${esc(txt(e))}<small>${t("why")}: ${esc(r)}, ${d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</small></div>`}).join("")||`<div class="ev">${t("empty")}</div>`;card()}
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#tm").onclick=()=>{tmode=tmode==="auto"?"d":tmode==="d"?"n":"auto";forceH=tmode==="d"?13:tmode==="n"?23:null;applyEnv();render()};
$("#wx").onclick=()=>{wmode=wmode==="auto"?"clr":wmode==="clr"?"rain":wmode==="rain"?"fog":"auto";render()};
$("#lg").onclick=()=>{L=L==="uk"?"en":"uk";try{localStorage.setItem("aion-l",L)}catch(e){}render()};
$("#head").onclick=()=>$("#sheet").classList.toggle("open");
$("#list").onclick=e=>{const x=e.target.closest(".ev");if(x&&x.dataset.id){select(+x.dataset.id);setMode("follow")}};

const cv=R.domElement,P=new Map(),RC=new THREE.Raycaster();let moved=0,pd=0,pm=null;
const pinch=()=>{const a=[...P.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])},mid=()=>{const a=[...P.values()];return[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]};
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(P.size===2){pd=pinch();pm=mid()}});
cv.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
if(P.size===1){const dx=e.clientX-o[0],dy=e.clientY-o[1];moved+=Math.abs(dx)+Math.abs(dy);cam.yaw-=dx*.006;if(mode!=="top")cam.pit=Math.max(.12,Math.min(1.45,cam.pit+dy*.005))}
else if(P.size===2){const d=pinch(),m=mid();if(pd)cam.dist=Math.max(6,Math.min(330,cam.dist*pd/d));pd=d;
if(pm&&mode!=="follow"){const k=cam.dist*.0016,dx=m[0]-pm[0],dy=m[1]-pm[1],sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
cam.goal.x=Math.max(-150,Math.min(150,cam.goal.x-cy*dx*k+(-sy)*dy*k));cam.goal.z=Math.max(-150,Math.min(150,cam.goal.z+sy*dx*k+(-cy)*dy*k))}pm=m;moved+=9}});
cv.addEventListener("pointerup",e=>{if(P.size===1&&moved<6){RC.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),C);const h=RC.intersectObjects([...robots.values()].map(r=>r.g),true);if(h.length)select(h[0].object.userData.rid)}P.delete(e.pointerId);pd=0;pm=null});
cv.addEventListener("pointercancel",e=>{P.delete(e.pointerId);pd=0;pm=null});
cv.addEventListener("wheel",e=>{cam.dist=Math.max(6,Math.min(330,cam.dist*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
addEventListener("resize",()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});

let _ae=.016,_fc=0;const clk=new THREE.Clock(),still=matchMedia("(prefers-reduced-motion:reduce)").matches;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.1),T=clk.elapsedTime;
_ae+=(dt-_ae)*.05;if(++_fc%90===0&&_ae>.036&&PR>.75){PR=Math.max(.75,PR-.15);R.setPixelRatio(PR);R.setSize(innerWidth,innerHeight)}
robots.forEach(r=>{const dx=r.to.x-r.g.position.x,dz=r.to.z-r.g.position.z,d=Math.hypot(dx,dz);if(d>.05){const s=Math.min(d,dt*6);r.g.position.x+=dx/d*s;r.g.position.z+=dz/d*s;r.g.rotation.y=Math.atan2(dx,dz)}r.g.children[0].position.y=d>.05?Math.sin(T*10)*.05:0});
const sr=robots.get(sel);if(mode==="follow"&&sr)cam.goal.copy(sr.g.position);
if(!still){if(halo){halo.rotation.x=T*.8;halo.rotation.y=T*.5}if(bust)bust.rotation.y=T*.25}
water.material.emissiveIntensity=.8+Math.sin(T)*.2;fx(dt,T);
cam.tgt.lerp(cam.goal,.1);const cp=Math.cos(cam.pit);
C.position.set(cam.tgt.x+Math.sin(cam.yaw)*cp*cam.dist,cam.tgt.y+Math.sin(cam.pit)*cam.dist,cam.tgt.z+Math.cos(cam.yaw)*cp*cam.dist);C.lookAt(cam.tgt);
R.render(S,C)})();
applyEnv();setInterval(applyEnv,20000);render();load();setInterval(load,30000);
</script></body></html>
